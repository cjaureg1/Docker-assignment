<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Prototype</title>
<link rel="stylesheet" href="style.css">
</head>
<body><main>
<div class="tag">AGILE TEAM DEMO</div><h1>Welcome back</h1><p>Enter your demo details to log in.</p>
<form id="login" novalidate>
<label for="email">Email</label><input id="email" type="email" placeholder="demo@example.com" autocomplete="off" aria-describedby="hint message">
<label for="password">Password</label><input id="password" type="password" placeholder="Enter demo password" autocomplete="off" aria-describedby="hint message">
<button type="submit">Log in</button>
<div id="message" role="status" aria-live="polite"></div>
</form>
<p id="hint" class="note">Try <strong>demo@example.com</strong> and <strong>Demo123!</strong></p>
<p class="note">Prototype only. Use made-up details. This demo does not create a real session or save your password.</p>
<script>
const form=document.getElementById('login'),email=document.getElementById('email'),password=document.getElementById('password'),message=document.getElementById('message');
form.addEventListener('submit',event=>{
event.preventDefault();
email.removeAttribute('aria-invalid');password.removeAttribute('aria-invalid');
const address=email.value.trim();let text='',ok=false;
if(!address||!password.value){text='Please enter both your email and password.';if(!address)email.setAttribute('aria-invalid','true');if(!password.value)password.setAttribute('aria-invalid','true');}
else if(!email.validity.valid){text='Please enter a valid email address.';email.setAttribute('aria-invalid','true');}
else if(address==='demo@example.com'&&password.value==='Demo123!'){text='Login successful! Welcome to the application demo.';ok=true;}
else{text='Incorrect email or password. Try the demo details below.';email.setAttribute('aria-invalid','true');password.setAttribute('aria-invalid','true');}
message.className=ok?'success':'error';message.textContent=text;
if(!ok){(email.getAttribute('aria-invalid')==='true'?email:password).focus();}
password.value='';
});
</script></main></body></html>
